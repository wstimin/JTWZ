<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="jtwz-admin-base-path" content="__JTWZ_ADMIN_BASE_PATH__" />
    <meta name="description" content="安全管理域名、静态网站与软件分发。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const saved = localStorage.getItem('jtwz.admin.theme');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || system;
        document.documentElement.dataset.surface = 'admin';
      })();
    </script>
    <title>JTWZ · 管理控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../src/admin-main.tsx"></script>
  </body>
</html>
