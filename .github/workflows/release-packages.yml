name: release-installation-packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build production assets
        run: |
          npm ci
          npm run build

      - name: Verify production-only release payload
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/jtwz-release-preflight"
          mkdir -p "$PACKAGE_DIR"
          cp -a package.json package-lock.json dist dist-server "$PACKAGE_DIR/"
          npm --prefix "$PACKAGE_DIR" ci --omit=dev
          cd "$PACKAGE_DIR"
          NODE_ENV=production API_HOST=127.0.0.1 API_PORT=18786 DATA_DIR="$RUNNER_TEMP/jtwz-release-data" \
            ADMIN_USERNAME=admin ADMIN_PASSWORD=release-preflight-password APP_SECRET=release-preflight-secret \
            ALLOW_LOCAL_STORAGE_IN_PRODUCTION=true node dist-server/index.js > "$RUNNER_TEMP/jtwz-release.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:18786/api/health >/dev/null; then exit 0; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/jtwz-release.log"
          exit 1

      - name: Assemble packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-${GITHUB_SHA:0:7}}"
          ROOT="$PWD"
          mkdir -p artifacts

          make_app() {
            local target="$1"
            mkdir -p "$target/app" "$target/installer"
            cp -a dist dist-server package.json package-lock.json .env.example "$target/app/"
            cp -a deploy/installer/. "$target/installer/"
          }

          mkdir -p "artifacts/jtwz-baota-v$VERSION"
          make_app "artifacts/jtwz-baota-v$VERSION"
          cp deploy/baota/install.sh deploy/baota/manifest.json "artifacts/jtwz-baota-v$VERSION/"
          node -e "const fs=require('fs');const p=process.argv[1];const m=JSON.parse(fs.readFileSync(p));m.version=process.argv[2];fs.writeFileSync(p,JSON.stringify(m,null,2)+'\\n')" "artifacts/jtwz-baota-v$VERSION/manifest.json" "$VERSION"
          chmod +x "artifacts/jtwz-baota-v$VERSION/install.sh" "artifacts/jtwz-baota-v$VERSION/installer/"*
          cp deploy/baota/README.md "artifacts/jtwz-baota-v$VERSION/README.md"
          (cd artifacts && zip -qr "jtwz-baota-v$VERSION.zip" "jtwz-baota-v$VERSION")

          mkdir -p "artifacts/jtwz-1panel-v$VERSION"
          make_app "artifacts/jtwz-1panel-v$VERSION"
          cp deploy/1panel/install.sh deploy/1panel/manifest.json deploy/1panel/Dockerfile deploy/1panel/docker-compose.yml deploy/1panel/jtwz-update-request "artifacts/jtwz-1panel-v$VERSION/"
          node -e "const fs=require('fs');const p=process.argv[1];const m=JSON.parse(fs.readFileSync(p));m.version=process.argv[2];fs.writeFileSync(p,JSON.stringify(m,null,2)+'\\n')" "artifacts/jtwz-1panel-v$VERSION/manifest.json" "$VERSION"
          chmod +x "artifacts/jtwz-1panel-v$VERSION/install.sh" "artifacts/jtwz-1panel-v$VERSION/jtwz-update-request" "artifacts/jtwz-1panel-v$VERSION/installer/"*
          cp deploy/1panel/README.md "artifacts/jtwz-1panel-v$VERSION/README.md"
          tar -C artifacts -czf "artifacts/jtwz-1panel-v$VERSION.tar.gz" "jtwz-1panel-v$VERSION"

          mkdir -p "artifacts/jtwz-one-click-v$VERSION"
          make_app "artifacts/jtwz-one-click-v$VERSION"
          cp deploy/one-click/install.sh deploy/one-click/jtwzctl deploy/one-click/README.md "artifacts/jtwz-one-click-v$VERSION/"
          chmod +x "artifacts/jtwz-one-click-v$VERSION/install.sh" "artifacts/jtwz-one-click-v$VERSION/jtwzctl" "artifacts/jtwz-one-click-v$VERSION/installer/"*
          tar -C artifacts -czf "artifacts/jtwz-one-click-v$VERSION.tar.gz" "jtwz-one-click-v$VERSION"

          sha256sum artifacts/*.zip artifacts/*.tar.gz > artifacts/SHA256SUMS
          printf '%s\n' "$VERSION" > artifacts/VERSION

      - name: Create signed update manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          JTWZ_UPDATE_PRIVATE_KEY_B64: ${{ secrets.JTWZ_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="artifacts/jtwz-one-click-v$VERSION.tar.gz"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/jtwz-one-click-v$VERSION.tar.gz"
          node scripts/create-update-manifest.mjs "$VERSION" "$ASSET" artifacts/update-manifest.json "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "JTWZ v$VERSION 正式版本"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jtwz-installation-packages
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/VERSION
            artifacts/update-manifest.json

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/update-manifest.json
