services:
  jtwz:
    build: .
    container_name: jtwz
    restart: unless-stopped
    init: true
    env_file:
      - app/.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/opt/jtwz/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
